[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anharmonic-labs"
version = "0.2.0"
description = "Hilbert-space simulation, polar operators, structured states, and independent quantum verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luis M. Minier" }]
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
reference = [
  "qiskit>=2.5,<3",
]
qiskit = [
  "qiskit>=2.5,<3",
  "qiskit-aer>=0.17,<1",
]
cirq = [
  "cirq-core>=1.6,<2",
]
qulacs = [
  "qulacs>=0.6,<1",
]
stim = [
  "stim>=1.15,<2",
]
ibm = [
  "qiskit-ibm-runtime>=0.43,<1",
]
dev = [
  "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "hardware: requires explicit credentials and real-QPU submission",
]
