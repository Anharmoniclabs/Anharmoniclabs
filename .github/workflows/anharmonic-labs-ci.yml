name: Anharmonic Labs simulation CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: anharmonic-labs

jobs:
  base-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/unit tests/differential/test_numpy_reference.py tests/structured/test_structured_family.py

  external-reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: qiskit
            test: tests/differential/test_qiskit_reference.py
          - extra: cirq
            test: tests/differential/test_cirq_reference.py
          - extra: qulacs
            test: tests/differential/test_qulacs_reference.py
          - extra: stim
            test: tests/differential/test_stim_reference.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,${{ matrix.extra }}]"
      - run: pytest -q ${{ matrix.test }}

  native-structured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: cmake -S native/structured_kernel -B build/anharmonic-structured -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/anharmonic-structured --config Release
      - run: pytest -q tests/structured

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/structured_kernel -B build/anharmonic-structured-sanitize -DANHARMONIC_STRUCTURED_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/anharmonic-structured-sanitize --parallel 2

  reproducibility-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev,qiskit]"
      - run: cmake -S native/structured_kernel -B build/anharmonic-structured
      - run: cmake --build build/anharmonic-structured
      - run: python experiments/run_differential_suite.py
      - run: python experiments/run_structured_suite.py
      - run: test -s results/differential_suite.json.sha256
      - run: test -s results/structured_suite.json.sha256
