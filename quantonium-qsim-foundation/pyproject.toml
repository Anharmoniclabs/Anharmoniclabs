[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantonium-qsim"
version = "0.1.0"
description = "Standalone quantum simulation laboratory for the canonical QuantoniumOS Resonant Fourier Transform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Luis M. Minier" }]
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
quantum = [
  "qiskit>=2.5,<3",
]
dev = [
  "pytest>=8.0,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
